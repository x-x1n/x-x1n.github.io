<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xinyuan LI | PROJECT 1</title>
    <link rel="icon" href="iiicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #DFFE78; --beige: #F5F5DC; --text-color: #111; --bg-white: #ffffff; }
        
        body { 
            margin: 0; 
            font-family: "Montserrat", sans-serif; 
            background: url('bbbbg.png') no-repeat center center fixed; 
            background-size: cover; 
            color: var(--text-color); 
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1; 
            width: 100%;
        }

        .top-nav { width: 90%; max-width: 1200px; height: 60px; margin: 20px auto; background-color: var(--beige); border-radius: 15px; display: grid; grid-template-columns: 3fr 2fr 2fr 2fr; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-item { display: flex; align-items: center; justify-content: center; text-decoration: none; color: #333; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; transition: background-color 0.4s ease; }
        .nav-item:hover { background-color: var(--accent); }
        
        .blog-container { width: 85%; max-width: 1100px; margin: 40px auto; padding: 50px; background: var(--bg-white); border-radius: 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); display: flex; gap: 50px; align-items: center; }
        .video-section { flex: 1; position: relative; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; z-index: 2; border-radius: 8px; overflow: hidden; background: #000; }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .video-shadow { position: absolute; top: 15px; left: 15px; width: 100%; height: 100%; background-color: var(--accent); z-index: 1; border-radius: 8px; }
        
        .text-section { flex: 1; text-align: left; }
        .text-section h2 { font-family: 'Playfair Display', serif; border-left: 8px solid var(--accent); padding-left: 15px; margin-bottom: 20px; }

        /* 社交图标部分样式 */
        .social-area {
            margin-top: 30px;
            position: relative;
        }
        .social-links {
            display: flex;
            gap: 20px;
        }
        .social-icon {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s;
            filter: grayscale(1);
        }
        .social-icon:hover {
            transform: scale(1.1);
            filter: grayscale(0);
        }
        
        /* 动态生成的文字样式 */
        #hint-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
            height: 20px; /* 固定高度防止抖动 */
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        footer {
            background-color: #000; color: var(--accent); padding: 30px 0; text-align: center;
            font-weight: 100; letter-spacing: 2px; margin-top: 30px;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="https://x-x1n.github.io/tndlproject.html" class="nav-item">Project Overview</a>
        <a href="https://x-x1n.github.io/tndlproject/project1.html" class="nav-item">Product 1</a>
        <a href="https://x-x1n.github.io/tndlproject/project2.html" class="nav-item">Product 2</a>
        <a href="https://x-x1n.github.io/tndlproject/project3.html" class="nav-item">Product 3</a>
    </nav>
    
    <main>
        <div class="blog-container">
            <div class="video-section">
                <div class="video-wrapper">
                     <video controls poster="你的封面图链接.jpg" playsinline>
                        <source src="https://res.cloudinary.com/dobhtjqpt/video/upload/v1/4月19日_oftkqb.mp4" type="video/mp4">
                        Your browser does not support this function.
                    </video>
                </div>
                <div class="video-shadow"></div>
            </div>
            <div class="text-section">
                <h2>Video Project</h2>
                <p>This is a video that collect & reconstruct everyday sounds in campus.<br>Explore the rhythm of UNNC through these soundscapes.</p>
                
                <!-- 图标展示区域 -->
                <div class="social-area">
                    <div class="social-links">
                        <img src="https://www.nottingham.edu.cn/SiteElements/Images/2023-Revamp/Social/social-wechat.svg" class="social-icon" onclick="showHint('WeChat')" alt="WeChat">
                        <img src="https://www.nottingham.edu.cn/SiteElements/Images/2023-Revamp/Social/social-weibo.svg" class="social-icon" onclick="showHint('Weibo')" alt="Weibo">
                        <img src="https://www.nottingham.edu.cn/SiteElements/Images/2023-Revamp/Social/social-bilibili.svg" class="social-icon" onclick="showHint('Bilibili')" alt="Bilibili">
                        <img src="https://www.nottingham.edu.cn/SiteElements/Images/2023-Revamp/Social/social-youtube.svg" class="social-icon" onclick="showHint('YouTube')" alt="YouTube">
                    </div>
                    <!-- 用于显示“假装有”的文字容器 -->
                    <div id="hint-text"></div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>Xinyuan LI 20514181  |  TNDL Project</footer>

    <script>
        function showHint(platform) {
            const hintBox = document.getElementById('hint-text');
            // 设置
            hintBox.innerText = `(${platform} → Please just *pretend* this video has been uploaded to these platforms and thus aligns with 'transmedia' feature...  :) )`;
            
            // 简单的动画效果
            hintBox.style.opacity = '0';
            setTimeout(() => {
                hintBox.style.opacity = '1';
            }, 50);
        }
    </script>
</body>
</html>
