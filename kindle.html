```html
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>自习室</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Tiny5&display=swap" rel="stylesheet">

  <style>
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: "DotGothic16", monospace;
      writing-mode: horizontal-tb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #111;
      -webkit-text-size-adjust: 100%;
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      direction: ltr;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 24px 5%;
    }

    .screen.rotated {
      position: fixed;
      top: 50%;
      left: 50%;
      min-height: 0;
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .info {
      position: absolute;
      top: 5%;
      left: 5%;
    }

    .time {
      font-family: "Tiny5", "DotGothic16", monospace;
      font-size: 112px;
      line-height: 0.95;
      letter-spacing: 0.015em;
      font-variant-numeric: tabular-nums;
    }

    .details {
      display: block;
      margin-top: 0.8em;
      font-size: 22px;
      line-height: 1.45;
    }

    .details div {
      margin-bottom: 0.25em;
    }

    .note {
      position: absolute;
      width: 30%;
      height: 15%;
      resize: none;
      border: 0;
      border-radius: 0;
      outline: none;
      padding: 0.5rem;
      background: transparent;
      color: #111;
      font: inherit;
      writing-mode: horizontal-tb;
    }

    /* テキストボックス 1：画面中央 */
    .note-center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* テキストボックス 2：画面右下 */
    .note-corner {
      right: 5%;
      bottom: 5%;
    }

    .side-actions {
      position: fixed;
      z-index: 5;
      top: 50%;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transform: translateY(-50%);
    }

    .sticky-button {
      width: 64px;
      height: 76px;
      min-width: 36px;
      min-height: 54px;
      padding: 0;
      border: 0;
      border-radius: 0.5rem 0 0 0.5rem;
      background: #E8F3FE;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .edit-dialog {
      display: none;
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      width: 86%;
      max-width: 38rem;
      max-height: 80%;
      overflow: auto;
      transform: translate(-50%, -50%);
      padding: 1rem;
      border: 1px solid #888;
      background: #fff;
      color: #111;
      font: inherit;
    }

    .edit-dialog.open {
      display: block;
    }

    .dialog-shade {
      display: none;
      position: fixed;
      z-index: 9;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #888;
      opacity: 0.45;
    }

    .dialog-shade.open {
      display: block;
    }

    .edit-fields {
      display: block;
    }

    .edit-fields textarea {
      display: block;
      width: 100%;
      min-height: 6rem;
      margin-bottom: 0.8rem;
      resize: vertical;
      border: 1px solid #aaa;
      border-radius: 0;
      padding: 0.5rem;
      background: #fff;
      color: #111;
      font: inherit;
    }

    .dialog-close {
      display: block;
      margin: 0.8rem 0 0 auto;
      padding: 0.35rem 0.8rem;
      border: 1px solid #777;
      border-radius: 0;
      background: #fff;
      color: #111;
      font: inherit;
    }

    @media (max-width: 700px) {
      .time {
        font-size: 76px;
      }

      .details {
        font-size: 18px;
      }

      .note {
        width: 38%;
        height: 13%;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <section class="info" aria-label="日時と香港島の天気">
      <div class="time" id="time">--:--</div>
      <div class="details">
        <div id="date">----年--月--日（--）</div>
        <div id="weather">香港島　天気を取得中…</div>
      </div>
    </section>

    <!-- テキストボックス 1：画面中央。内容は空欄のまま。 -->
    <textarea class="note note-center" aria-label="中央のメモ" spellcheck="false"></textarea>

    <!-- テキストボックス 2：画面右下。内容は空欄のまま。 -->
    <textarea class="note note-corner" aria-label="右下のメモ" spellcheck="false"></textarea>
  </main>

  <nav class="side-actions" aria-label="ページ操作">
    <button
      class="sticky-button"
      id="rotateButton"
      type="button"
      aria-label="画面を時計回りに90度回転">
    </button>
    <button
      class="sticky-button"
      id="editButton"
      type="button"
      aria-label="メモ編集ウィンドウを開く">
    </button>
  </nav>

  <div class="dialog-shade" id="dialogShade"></div>

  <div class="edit-dialog" id="editDialog" role="dialog" aria-label="メモを編集">
    <div class="edit-fields">
      <textarea id="centerEditor" aria-label="中央のメモを編集" spellcheck="false"></textarea>
      <textarea id="cornerEditor" aria-label="右下のメモを編集" spellcheck="false"></textarea>
    </div>
    <button class="dialog-close" id="closeDialog" type="button">閉じる</button>
  </div>

  <script>
    var timeEl = document.getElementById('time');
    var dateEl = document.getElementById('date');
    var weatherEl = document.getElementById('weather');
    var screenEl = document.querySelector('.screen');
    var frontNotes = document.querySelectorAll('.note');
    var editors = [
      document.getElementById('centerEditor'),
      document.getElementById('cornerEditor')
    ];
    var editDialog = document.getElementById('editDialog');
    var dialogShade = document.getElementById('dialogShade');

    function fitScreen() {
      var width = window.innerWidth ||
        document.documentElement.clientWidth ||
        document.body.clientWidth;
      var height = window.innerHeight ||
        document.documentElement.clientHeight ||
        document.body.clientHeight;

      if (height > width) {
        screenEl.className = 'screen rotated';
        screenEl.style.width = height + 'px';
        screenEl.style.height = width + 'px';
      } else {
        screenEl.className = 'screen';
        screenEl.style.width = '100%';
        screenEl.style.height = '100%';
      }
    }

    fitScreen();
    window.onresize = fitScreen;

    function toggleRotated() {
      if ((' ' + screenEl.className + ' ').indexOf(' rotated ') >= 0) {
        screenEl.className = screenEl.className.replace(' rotated', '');
      } else {
        screenEl.className += ' rotated';
      }
    }

    document.getElementById('rotateButton').onclick = toggleRotated;

    function openEditor() {
      var i;
      for (i = 0; i < editors.length; i++) {
        editors[i].value = frontNotes[i].value;
      }
      editDialog.className += ' open';
      dialogShade.className += ' open';
    }

    function closeEditor() {
      editDialog.className = editDialog.className.replace(' open', '');
      dialogShade.className = dialogShade.className.replace(' open', '');
    }

    document.getElementById('editButton').onclick = openEditor;
    document.getElementById('closeDialog').onclick = closeEditor;
    dialogShade.onclick = closeEditor;

    (function () {
      var i;
      for (i = 0; i < editors.length; i++) {
        (function (index) {
          editors[index].onkeyup = editors[index].oninput = function () {
            frontNotes[index].value = editors[index].value;
          };

          frontNotes[index].onkeyup = frontNotes[index].oninput = function () {
            editors[index].value = frontNotes[index].value;
          };
        }(i));
      }
    }());

    function updateClock() {
      var now = new Date(new Date().getTime() + 8 * 60 * 60 * 1000);
      var days = [
        '日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'
      ];
      var hour = now.getUTCHours();
      var minute = now.getUTCMinutes();
      var month = now.getUTCMonth() + 1;
      var day = now.getUTCDate();

      timeEl.textContent =
        (hour < 10 ? '0' : '') + hour + ':' +
        (minute < 10 ? '0' : '') + minute;

      dateEl.textContent =
        now.getUTCFullYear() + '年' +
        (month < 10 ? '0' : '') + month + '月' +
        (day < 10 ? '0' : '') + day + '日（' +
        days[now.getUTCDay()] + '）';
    }

    updateClock();
    setInterval(updateClock, 15000);

    var weatherText = {
      0: '快晴', 1: '晴れ', 2: '一部曇り', 3: '曇り',
      45: '霧', 48: '霧', 51: '弱い霧雨', 53: '霧雨', 55: '強い霧雨',
      56: '弱い凍雨', 57: '凍雨', 61: '弱い雨', 63: '雨', 65: '強い雨',
      66: '弱い凍雨', 67: '凍雨', 71: '弱い雪', 73: '雪', 75: '強い雪',
      77: '霧雪', 80: 'にわか雨', 81: '雨', 82: '強いにわか雨',
      85: 'にわか雪', 86: '強いにわか雪', 95: '雷雨',
      96: '雹を伴う雷雨', 99: '強い雹を伴う雷雨'
    };

    function updateWeather() {
      var request = new XMLHttpRequest();

      request.open(
        'GET',
        'https://api.open-meteo.com/v1/forecast?latitude=22.27&longitude=114.16&current=temperature_2m,weather_code&timezone=Asia%2FHong_Kong',
        true
      );

      request.onreadystatechange = function () {
        if (request.readyState === 4) {
          if (request.status >= 200 && request.status < 300) {
            try {
              var current = JSON.parse(request.responseText).current;
              var condition = weatherText[current.weather_code] || '天気情報なし';
              weatherEl.textContent =
                '香港島　' + condition + '　' +
                Math.round(current.temperature_2m) + '℃';
            } catch (e) {
              weatherEl.textContent = '香港島　天気情報なし';
            }
          } else {
            weatherEl.textContent = '香港島　天気情報なし';
          }
        }
      };

      request.onerror = function () {
        weatherEl.textContent = '香港島　天気情報なし';
      };

      request.send();
    }

    updateWeather();
    setInterval(updateWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
